<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- CSS du header -->
    <link rel="stylesheet" href="0.2header.css">
    <link rel="stylesheet" href="5.2peinture.css">
</head>
<body>

<section class="peinture-section">
    <h2 class="section-title deco-line-peinture">Peinture</h2>

    <div class="peinture-grid">
        <img src="peinture/peinture_clown.jpg" alt="Peinture 1">
        <img src="peinture/peinture_lavande.jpg" alt="Peinture 2">
        <img src="peinture/peinture_singe.jpg" alt="Peinture 3">
    </div>
</section>


<div id="lightbox" class="lightbox">
    <img id="lightbox-img" src="" alt="">
</div>

<!-- ---------- SCRIPT BOX ZOOM------------>
<script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    // Sélectionner uniquement les images de la section peinture
    const peintureImages = document.querySelectorAll('.peinture-grid img');

    function enableZoom(images) {
        images.forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightbox.classList.add('active');
            });
        });
    }

    enableZoom(peintureImages);

    lightbox.addEventListener('click', () => {
        lightbox.classList.remove('active');
    });
</script>



<!-- ---------- HEADER SCRIPT ---------- -->
<!-- Charger le header -->
<script>
    fetch("0.1header.html")
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML("afterbegin", data);
        });
</script>

<!-- ---------- HEADER ---------- -->
<script>
    window.addEventListener("scroll", function () {
        const header = document.querySelector("header");
        if (window.scrollY > 50) {
            header.classList.add("shrink");
        } else {
            header.classList.remove("shrink");
        }
    });
</script>
</body>
</html>
