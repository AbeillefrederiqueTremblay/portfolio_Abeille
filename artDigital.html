<!-- ---------- HEADER ---------- -->

<section class="notifs">
    <h2>Notifs</h2>

    <div class="carousel">
        <button class="carousel-btn prev">←</button>

        <div class="carousel-track">
            <img src="artDigitalImage/notifsPoster.jpg" alt="Notifs Poster">
            <img src="artDigitalImage/bibliothequeNuit_01.jpg" alt="Bibliothèque Nuit 01">
            <img src="artDigitalImage/bibliothequeNuit_02.jpg" alt="Bibliothèque Nuit 02">
            <img src="artDigitalImage/bibliothequeNuit_03.jpg" alt="Bibliothèque Nuit 03">
            <img src="artDigitalImage/bibliothequeNuit_04.jpg" alt="Bibliothèque Nuit 04">
        </div>

        <button class="carousel-btn next">→</button>
    </div>
</section>


<script>
    const track = document.querySelector('.carousel-track');
    const images = Array.from(track.children);
    let index = 0;

    function updateCarousel() {
        track.innerHTML = "";
        track.appendChild(images[index]);
    }

    document.querySelector('.next').addEventListener('click', () => {
        index = (index + 1) % images.length;
        updateCarousel();
    });

    document.querySelector('.prev').addEventListener('click', () => {
        index = (index - 1 + images.length) % images.length;
        updateCarousel();
    });

    updateCarousel(); // affiche la première image
</script>
