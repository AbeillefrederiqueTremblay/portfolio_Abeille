<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Portfolio – Abeille</title>
    <link rel="stylesheet" href="1.2Style.css">

    <!--     Import Font   -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS du header -->
    <link rel="stylesheet" href="0.2header.css">
</head>

<body>
<!--HEADER-->
<div id="header"></div>

<!-- section soleil-->
<section class="soleil">

    <div class="soleil-image">
        <img src="assets/femme.jpg" alt="Abeille">
    </div>

    <div class="soleil-text">
        <p class="quote2">
            « Salut, je suis un artiste qui fait plein de choses d'artiste »
            <span class="quote-author2">— Abeille, un intellectuel</span>
        </p>
    </div>

</section>

<!-- mes activités-->
<section class="activites">


    <div class="activite-titre">
        <h2> ⋆˚࿔ Mes projets ࿔˚⋆ </h2>
    </div>


    <div class="activite-row">

        <div class="activite">
            <a href="2.1artDigital.html" class="activite-link">
                <h3>Art Digital</h3>
                <img src="artDigitalImage/notifsPoster.jpg" alt="Abeille">
            </a>
        </div>


        <div class="activite">
            <a href="3.1linogravure.html" class="activite-link">
                <h3>Linogravure</h3>
                <img src="linoImage/lino_italienne.jpg" alt="Abeille">
            </a>
        </div>

        <div class="activite">
            <a href="4.1sketchs.html" class="activite-link">
            <h3>Sketchs</h3>
            <img src="sketchs/sketchs_grosNez.jpg" alt="Abeille">
            </a>
        </div>


        <div class="activite">
            <a href="5.1peinture.html" class="activite-link">

                <img src="peinture/peinture_singe.jpg" alt="Abeille">

    </div>

</section>


<!--FOOTER-->
<footer>
    <p>© 2026 Abeille - Tous droits réservés</p>
</footer>


<!-- ---------- HEADER SCRIPT ---------- -->
<!-- Charger le header -->
<script>
    fetch("0.1header.html")
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML("afterbegin", data);
        });
</script>

<!-- ---------- HEADER ---------- -->
<script>
    window.addEventListener("scroll", function () {
        const header = document.querySelector("header");
        if (window.scrollY > 50) {
            header.classList.add("shrink");
        } else {
            header.classList.remove("shrink");
        }
    });
</script>

</body>
</html>
